name: Bug report
description: Something in the SDK, docs, or examples doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected vs. what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >-
        A minimal code snippet. Do **not** include real `apiSid` / `apiToken` values or
        real printer / device UIDs — use placeholders.
      render: ts
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: expedy-sdk-node version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true
  - type: dropdown
    id: resource
    attributes:
      label: Affected resource
      options:
        - printers (cloud thermal printer)
        - devices (Raspberry Pi / USB)
        - Documentation only
        - Not sure
    validations:
      required: true
